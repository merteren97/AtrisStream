[package]
name = "atris-sources"
version = "0.1.0"
edition = "2021"

[dependencies]
atris-core = { path = "../atris-core" }
atris-storage = { path = "../atris-storage" }
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "json"] }
rquickjs = "0.15"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
