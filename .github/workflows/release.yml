name: Release (Android TV & Desktop)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (SemVer, e.g. 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      prerelease:
        description: "Mark GitHub Release as pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create GitHub Release as draft"
        required: false
        default: false
        type: boolean
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and ensure GitHub Release exists
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
          fi

          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer version: '$RAW' (expected e.g. 0.1.0 or v0.1.0)"
            exit 1
          fi

          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; build artifacts will be uploaded to it."
            else
              ARGS=(
                "$TAG"
                --target "${{ github.sha }}"
                --title "AtrisStream ${TAG}"
                --generate-notes
              )
              if [ "${{ inputs.prerelease }}" = "true" ]; then
                ARGS+=(--prerelease)
              fi
              if [ "${{ inputs.draft }}" = "true" ]; then
                ARGS+=(--draft)
              fi
              gh release create "${ARGS[@]}"
              echo "Created GitHub Release $TAG"
            fi
          fi

  build-android:
    needs: prepare-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode optional Android release keystore
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
          echo "path=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build Android TV Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionName="${{ needs.prepare-release.outputs.version }}" \
            -PappVersionCode="${{ github.run_number }}" \
            --stacktrace

      - name: Rename Release APK
        run: |
          mkdir -p release-assets
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" "release-assets/AtrisStream-AndroidTV-${{ needs.prepare-release.outputs.tag }}.apk"
          ls -lh release-assets/

      - name: Upload Android TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtrisStream-AndroidTV-${{ needs.prepare-release.outputs.tag }}
          path: release-assets/*.apk

      - name: Attach Android TV APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" release-assets/*.apk --clobber

  build-desktop:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev
          sudo apt-get install -y libmpv-dev libmpv2 || sudo apt-get install -y libmpv-dev libmpv1 || true
          bash desktop/scripts/setup-libmpv.sh || true

      - name: Setup Windows libmpv (optional native bundle)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            ./desktop/scripts/setup-libmpv.ps1
          } catch {
            Write-Warning "libmpv download skipped: $_ (WebView fallback remains active)"
          }

      - name: Install frontend dependencies & build
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Run Rust workspace unit tests
        working-directory: desktop/src-tauri
        run: cargo test --workspace

      - name: Build Tauri Desktop Bundle (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop
        shell: pwsh
        run: |
          $cfg = @{ version = "${{ needs.prepare-release.outputs.version }}" }
          if (Test-Path "src-tauri/lib/libmpv-2.dll") {
            $cfg.bundle = @{ resources = @("lib/libmpv-2.dll") }
          }
          $cfgPath = Join-Path (Get-Location) "src-tauri/tauri.release.conf.json"
          $cfg | ConvertTo-Json -Depth 5 | Set-Content -Path $cfgPath -Encoding utf8NoBOM
          npx tauri build --target ${{ matrix.target }} --config $cfgPath

      - name: Build Tauri Desktop Bundle (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        working-directory: desktop
        run: |
          CFG_PATH="$(pwd)/src-tauri/tauri.release.conf.json"
          printf '{"version":"%s"}\n' "${{ needs.prepare-release.outputs.version }}" > "$CFG_PATH"
          npx tauri build --target ${{ matrix.target }} --config "$CFG_PATH"

      - name: Collect Desktop installers
        shell: bash
        run: |
          mkdir -p release-assets
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE_DIR" -maxdepth 2 -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.AppImage" -o \
            -name "*.deb" \
          \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Upload Desktop workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AtrisStream-Desktop-${{ matrix.label }}-${{ needs.prepare-release.outputs.tag }}
          path: release-assets/*

      - name: Attach Desktop installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(release-assets/*)
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "${{ needs.prepare-release.outputs.tag }}" "${FILES[@]}" --clobber
          fi
