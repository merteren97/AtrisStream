name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build Debug & Release APKs (R8 verification)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AtrisStream-AndroidTV-debug-apk
          path: app/build/outputs/apk/debug/*.apk
